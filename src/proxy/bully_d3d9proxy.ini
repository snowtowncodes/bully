[renderer]
backend=on12
; 9On12 device selection: internal (default) or explicit.
on12_device=internal
; force_swap_effect=none       ; Override swap effect: none, discard, flip, copy (default: none)
; force_present_interval=none  ; Override present interval: none, immediate, default, one (default: none)

[diagnostics]
trace_device=1
capture_frames=1
capture_frontbuffer=1
capture_frame=60
; none (default) is observational. registry only reminds the user to set
; the active HKLM D3D9On12 UseDebugLayer control externally before device creation.
d3d12_debug_layer=none
