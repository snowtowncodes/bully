[renderer]
; native (default), dxvk, or on12 (experimental).
; dxvk requires an x86 DXVK d3d9.dll renamed to dxvk_d3d9.dll beside Bully.exe.
backend=native
; 9On12 device selection: internal (default) or explicit.
on12_device=internal
; Diagnostic presentation-parameter overrides, applied at CreateDevice and Reset.
; force_swap_effect=none       ; Override swap effect: none, discard, flip, copy (default: none)
; force_present_interval=none  ; Override present interval: none, immediate, default, one (default: none)
; force_multisample=0          ; Force MultiSampleType at CreateDevice/Reset: 0=off, 2=2x, 4=4x, 8=8x, ... (default: 0)
; force_multisample_quality=0  ; MultiSampleQuality to use with force_multisample (default: 0)
; force_width=0                ; Backbuffer width; applied only when force_height is also >0 (default: 0 = off)
; force_height=0               ; Backbuffer height; applied only when force_width is also >0 (default: 0 = off)
;                              ; If a widescreen fix ASI is installed, prefer leaving force_width/force_height at 0.
; force_windowed=0             ; 0=off, 1=windowed, 2=fullscreen; overrides the game's Windowed flag (default: 0)
; force_refresh_hz=0           ; FullScreen_RefreshRateInHz; applied only in fullscreen (force_windowed=2 or already fullscreen) (default: 0 = off)

[diagnostics]
trace_device=1
; Opt-in: GetRenderTargetData at capture_frame can hitch Present.
capture_frames=0
; Opt-in only: frontbuffer readback can interfere with presentation.
capture_frontbuffer=0
capture_frame=60
; none (default) is observational. registry only reminds the user to set
; the active HKLM D3D9On12 UseDebugLayer control externally before device creation.
d3d12_debug_layer=none

[mods]
; test_marker=1 visibly draws a magenta verification marker; keep 0 for normal gameplay.
test_marker=0
test_marker_size=64
